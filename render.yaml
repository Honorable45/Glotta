# Plateforme Glotta sur l'offre gratuite de Render, avec une base Neon : la base gratuite de Render expire.
# L'adresse de la base et la clé privée sont demandées à la création et ne sont jamais versionnées.
# Sans Shell gratuit, les migrations se lancent depuis le poste de développement, avant le déploiement.
services:
  - type: web
    name: glotta
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # --prod=false : Prisma et Vite sont nécessaires au build, même avec NODE_ENV=production.
    buildCommand: npx -y pnpm@9.15.9 install --frozen-lockfile --prod=false --ignore-scripts --filter @gestion/api... --filter @gestion/admin... && npx -y pnpm@9.15.9 --filter @gestion/api generate && npx -y pnpm@9.15.9 --filter @gestion/admin build
    startCommand: cd apps/api && ../../node_modules/.bin/tsx src/server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_DIST
        value: /opt/render/project/src/apps/admin/dist
      - key: DATABASE_URL
        sync: false
      - key: LICENSE_PRIVATE_KEY
        sync: false
